<title>Project Fleet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f6f5f1;--panel:#fff;--fg:#1c1b19;--muted:#6a675f;--line:#dedbd2;--accent:#2f5d8a;--ok:#2d7a46;--warn:#9a6a00;--bad:#b3362b;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171716;--panel:#222220;--fg:#ecebe6;--muted:#a09d94;--line:#383733;--accent:#8db8e6;--ok:#6cc58a;--warn:#e0b04a;--bad:#f08a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171716;--panel:#222220;--fg:#ecebe6;--muted:#a09d94;--line:#383733;--accent:#8db8e6;--ok:#6cc58a;--warn:#e0b04a;--bad:#f08a80;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));overflow-x:hidden}
#app{max-width:1000px;margin:0 auto;min-width:0}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:15px;margin:28px 0 10px;letter-spacing:.01em}
a{color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:13px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.pill{display:inline-block;font-size:11px;line-height:1.5;border:1px solid currentColor;border-radius:999px;padding:0 8px;white-space:nowrap;margin-right:4px}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:16px 0;overflow-wrap:anywhere}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile b{display:block;font-size:26px;line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--fg);text-decoration:none;min-width:0}
.card:hover,.card:focus-visible{border-color:var(--accent)}
.card .name{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.stats b{display:block;font-size:17px}.stats span{font-size:11px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;overflow-wrap:anywhere}
.row .top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.row .title{font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.btn{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:5px 12px;text-decoration:none;color:var(--fg);background:var(--bg);font-size:13px}
.btn.primary{border-color:var(--accent);color:var(--accent)}
.body{white-space:pre-wrap;font-size:13px;color:var(--muted);margin:8px 0 0;max-height:16em;overflow:auto}
details{margin-top:10px}summary{cursor:pointer;color:var(--muted);font-size:13px}
.back{display:inline-block;margin-bottom:8px;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;margin-top:8px}
.btn{cursor:pointer;font-family:inherit}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0;display:grid;gap:10px}
.form label{display:grid;gap:3px;font-size:13px;color:var(--muted)}
.form input[type=text]{font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0;width:100%}
.form .cb{display:flex;gap:8px;align-items:center;color:var(--fg)}
.err{color:var(--bad);font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
</style>
<div id="app"><div class="msg">Loading…</div></div>
<script>
/*__FLEET_LOGIC__*/
(function () {
  'use strict';
  var L = window.FleetLogic;
  var app = document.getElementById('app');
  var state = { db: undefined, isOwner: false, projects: null, snaps: null, meta: null, error: '', archivedOpen: false,
    userId: 'owner', formOpen: false, form: { name: '', repo: '', blurb: '', wait: false }, formErrors: {}, repos: null, reposNote: '',
    confirming: '', notice: '', busy: false,
    mcp: undefined, sess: { status: 'idle', infos: [], note: '', msg: '' }, otherOpen: false };

  // ---- tiny DOM helpers: data only ever goes in through textContent ----
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null && text !== '') e.textContent = String(text);
    return e;
  }
  function add(parent) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]); return parent; }
  function link(url, text, cls) {
    var href = L.safeHref(url);
    if (!href) return el('span', cls, text);
    var a = el('a', cls, text);
    a.href = href; a.target = '_blank'; a.rel = 'noopener';
    return a;
  }
  function when(s) {
    var d = new Date(s);
    return isNaN(d.getTime()) ? '' : d.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
  }
  function statusClass(s) { return s === 'Active' ? 'ok' : s === 'Quiet' ? 'warn' : s === 'Not connected' ? 'bad' : 'muted'; }
  function pill(text, cls) { return el('span', 'pill ' + (cls || 'muted'), text); }
  function message(text) { return add(el('div', 'msg'), el('div', '', text)); }

  // One status pill: a not-connected project shows only "Not connected" (an old "Active" would contradict it).
  function statusPills(box, c, s) {
    if (c.notConnected || s.status === 'Not connected') add(box, pill('Not connected', 'bad'));
    else add(box, pill(s.status || '—', statusClass(s.status)));
    if (c.stale) add(box, pill('Stale', 'warn'));
  }

  // ---- owner actions (one write per click, never on load) ----
  function writeProject(name, data, isNew, done) {
    if (!state.db || !state.isOwner || state.busy) return;
    state.busy = true; state.notice = ''; render();
    var ref = state.db.doc('projects/' + name);
    var p = isNew
      ? ref.get().then(function (d) { if (d && d.exists) throw { code: 'exists' }; return ref.set(data); })
      : ref.update(data);
    p.then(function () { state.busy = false; done(); render(); }, function (e) {
      state.busy = false;
      state.notice = e && e.code === 'exists' ? 'A project called ' + name + ' already exists.' : L.writeErrorText(e);
      render();
    });
  }

  function submitForm() {
    var f = state.form;
    var names = (state.projects || []).map(function (p) { return p.id; });
    var r = L.validateProjectForm({ name: f.name, repo: f.repo, blurb: f.blurb, allOpenPrsWait: f.wait }, names, Date.now(), state.userId);
    state.formErrors = r.errors;
    if (!r.ok) { render(); return; }
    writeProject(r.name, r.doc, true, function () {
      state.formOpen = false; state.form = { name: '', repo: '', blurb: '', wait: false };
      state.notice = 'Added ' + r.name + '. It shows “Waiting for first refresh” until you say “update the dashboard”.';
    });
  }

  function loadRepos() {
    if (state.repos !== null || !state.mcp) { if (!state.mcp) state.reposNote = 'Type the repo as owner/repo.'; return; }
    state.repos = [];
    state.mcp.callTool(L.SERVER, 'list_repos', { limit: 100 }, { cache: false }).then(function (res) {
      state.repos = L.repoNames(L.unwrapPayload(res));
      state.reposNote = state.repos.length ? '' : 'No repos were listed. Type the repo as owner/repo.';
      render();
    }, function () { state.reposNote = 'The repo list is not available. Type the repo as owner/repo.'; render(); });
  }

  function addForm() {
    var f = state.form, box = el('div', 'form');
    function input(label, key, ph, listId) {
      var l = el('label', '', label), i = el('input'); i.type = 'text'; i.value = f[key]; i.placeholder = ph || '';
      if (listId) i.setAttribute('list', listId);
      i.addEventListener('input', function () { f[key] = i.value; });
      add(l, i);
      if (state.formErrors[key]) add(l, el('span', 'err', state.formErrors[key]));
      return l;
    }
    add(box, input('Project name (lowercase, digits, dashes)', 'name', 'my-project'));
    var rl = input('GitHub repo (owner/repo)', 'repo', 'owner/repo', 'repo-list');
    if (state.repos && state.repos.length) {
      var dl = el('datalist'); dl.id = 'repo-list';
      state.repos.forEach(function (n) { var o = el('option'); o.value = n; add(dl, o); });
      add(rl, dl);
    }
    if (state.reposNote) add(rl, el('span', 'small muted', state.reposNote));
    add(box, rl);
    add(box, input('One-line description', 'blurb', ''));
    var cl = el('label', 'cb'), cb = el('input'); cb.type = 'checkbox'; cb.checked = !!f.wait;
    cb.addEventListener('change', function () { f.wait = cb.checked; });
    add(cl, cb, el('span', '', 'Every open PR needs my OK'));
    add(box, cl);
    var b = el('div', 'btns');
    var go = el('button', 'btn primary', 'Add project'); go.type = 'button'; go.disabled = state.busy;
    go.addEventListener('click', submitForm);
    var no = el('button', 'btn', 'Cancel'); no.type = 'button';
    no.addEventListener('click', function () { state.formOpen = false; state.formErrors = {}; render(); });
    add(b, go, no); add(box, b);
    return box;
  }

  function archiveControls(name, archived) {
    var b = el('div', 'btns');
    if (archived) {
      var u = el('button', 'btn', 'Unarchive'); u.type = 'button'; u.disabled = state.busy;
      u.addEventListener('click', function () { writeProject(name, { archived: false }, false, function () { state.notice = 'Unarchived ' + name + '.'; }); });
      return add(b, u);
    }
    if (state.confirming === name) {
      add(b, el('span', 'small', 'Archive ' + name + '? It leaves the overview and the refresh skips it.'));
      var y = el('button', 'btn danger', 'Archive'); y.type = 'button'; y.disabled = state.busy;
      y.addEventListener('click', function () {
        writeProject(name, { archived: true }, false, function () { state.confirming = ''; state.notice = 'Archived ' + name + '.'; location.hash = ''; });
      });
      var n = el('button', 'btn', 'Cancel'); n.type = 'button';
      n.addEventListener('click', function () { state.confirming = ''; render(); });
      return add(b, y, n);
    }
    var a = el('button', 'btn', 'Archive project'); a.type = 'button';
    a.addEventListener('click', function () { state.confirming = name; state.notice = ''; render(); });
    return add(b, a);
  }

  // ---- live sessions (fetched once on load; "Refresh sessions" fetches again) ----
  function loadSessions() {
    var S = state.sess;
    if (!state.mcp) return;
    if (S.status === 'loading') return;
    S.status = 'loading'; S.msg = ''; render();
    state.mcp.callTool(L.SERVER, 'list_sessions', { limit: 30, mine: true }, { cache: false }).then(function (res) {
      var listed = L.unwrapPayload(res);
      if (!listed || !Array.isArray(listed.data)) throw { code: 'bad_shape' };
      var pick = L.pickSessions(listed, Date.now(), 20), failed = 0;
      return Promise.all(pick.picked.map(function (row) {
        return state.mcp.callTool(L.SERVER, 'get_session', { session_id: row.id }, { cache: false }).then(
          function (r) { var d = L.unwrapPayload(r); return d ? L.sessionInfo(d, row) : (failed++, null); },
          function () { failed++; return null; });
      })).then(function (infos) {
        S.infos = infos.filter(Boolean); S.status = 'ready';
        S.note = [pick.skippedByCap ? pick.skippedByCap + ' older sessions not checked' : '', failed ? failed + ' sessions could not be read' : ''].filter(Boolean).join(' · ');
        S.at = Date.now();
        render();
      });
    }).catch(function (e) { S.status = 'error'; S.infos = []; S.msg = L.mcpErrorText(e); render(); });
  }

  function sessionRow(x) {
    var r = el('div', 'row'), top = el('div', 'top');
    add(top, pill(L.bucketLabel(x.bucket), L.bucketClass(x.bucket)), link(L.sessionHref(x.id), x.title || x.id, 'title'));
    add(r, top);
    add(r, el('div', 'small muted', [x.branch ? 'Branch ' + x.branch : '', x.updated_at ? 'Updated ' + when(x.updated_at) : ''].filter(Boolean).join(' · ')));
    return r;
  }

  function refreshButton() {
    var b = el('button', 'btn', state.sess.status === 'loading' ? 'Loading…' : 'Refresh sessions'); b.type = 'button';
    b.disabled = state.sess.status === 'loading';
    b.addEventListener('click', loadSessions);
    return b;
  }

  // Shared status line for both session views; returns true when the list can be shown.
  function sessionsReady(box) {
    var S = state.sess;
    if (state.mcp === undefined) { add(box, el('div', 'small muted', 'Checking the Claude Code Remote connector…')); return false; }
    if (state.mcp === null) { add(box, el('div', 'small muted', 'Live sessions are not shown: the Claude Code Remote connector is not available or was not allowed. The rest of the page works.')); return false; }
    if (S.status === 'error') { add(box, el('div', 'small warn', S.msg)); return false; }
    if (S.status === 'loading' && !S.infos.length) { add(box, el('div', 'small muted', 'Loading sessions…')); return false; }
    return true;
  }

  function sessionsPanel(c) {
    var box = el('div');
    add(box, el('h2', '', 'Live sessions'));
    var ok = sessionsReady(box);
    if (ok) {
      var g = L.groupSessions(state.sess.infos, [{ name: c.name, repo: c.repo }]).byProject[c.name] || [];
      var list = el('div', 'list');
      if (!g.length) add(list, el('div', 'small muted', 'No Claude sessions are working on this project.'));
      g.forEach(function (x) { add(list, sessionRow(x)); });
      add(box, list);
      if (state.sess.note) add(box, el('div', 'small muted', state.sess.note));
    }
    if (state.mcp) add(box, add(el('div', 'btns'), refreshButton()));
    return box;
  }

  function otherSessions(groups) {
    var d = el('details'); d.open = state.otherOpen;
    d.addEventListener('toggle', function () { state.otherOpen = d.open; });
    var other = null, ok;
    var inner = el('div');
    ok = sessionsReady(inner);
    if (ok) {
      other = L.groupSessions(state.sess.infos, groups.active.map(function (c) { return { name: c.name, repo: c.repo }; })).other;
      var list = el('div', 'list');
      if (!other.length) add(list, el('div', 'small muted', 'Every recent session belongs to a project above.'));
      other.forEach(function (x) { add(list, sessionRow(x)); });
      add(inner, list);
      if (state.sess.note) add(inner, el('div', 'small muted', state.sess.note));
    }
    if (state.mcp) add(inner, add(el('div', 'btns'), refreshButton()));
    add(d, el('summary', '', 'Other sessions' + (other ? ' (' + other.length + ')' : '')), inner);
    return d;
  }

  // ---- overview ----
  function card(c) {
    var a = el('a', 'card');
    a.href = '#p-' + c.name;
    var s = c.snap;
    var head = el('div'); add(head, el('span', 'name', c.name));
    add(a, head);
    if (c.blurb) add(a, el('div', 'small muted', c.blurb));
    if (!s) { add(a, el('div', 'small warn', 'Waiting for first refresh')); return a; }
    var pills = el('div');
    statusPills(pills, c, s);
    add(a, pills);
    if (c.notConnected) add(a, el('div', 'small bad', L.notConnectedText(c.repo, s.not_connected_reason)));
    var st = el('div', 'stats');
    [['waiting_on_you', 'waiting'], ['open_pr_count', 'open PRs'], ['open_issue_count', 'issues'], ['merged_7d', 'merged/wk']].forEach(function (p) {
      add(st, add(el('div'), el('b', '', s[p[0]] == null ? '—' : s[p[0]]), el('span', '', p[1])));
    });
    add(a, st);
    add(a, el('div', 'small muted', s.last_activity_at ? 'Last activity ' + when(s.last_activity_at) : 'No recent activity'));
    return a;
  }

  function waitingRow(w) {
    var r = el('div', 'row'), top = el('div', 'top');
    add(top, link(w.url, w.title || w.key, 'title'), pill(w.label || w.kind || '', 'warn'),
      el('span', 'small muted', (w.project || '') + ' ' + (w.kind || '') + ' #' + (w.number == null ? '' : w.number)));
    add(r, top, el('div', 'small muted', (w.why || '') + ' · ' + L.ageLabel(w.age_days)));
    return r;
  }

  function overview(groups) {
    var root = el('div');
    add(root, el('h1', '', 'Project Fleet'));
    add(root, el('div', 'small muted', state.meta && state.meta.updated_at ? 'Data as of ' + when(state.meta.updated_at) : 'No refresh yet — say "update the dashboard".'));
    if (state.notice) add(root, el('div', 'small', state.notice));
    if (state.isOwner && state.db) {
      if (state.formOpen) add(root, addForm());
      else {
        var ab = el('button', 'btn primary', 'Add project'); ab.type = 'button'; ab.style.marginTop = '10px';
        ab.addEventListener('click', function () { state.formOpen = true; state.notice = ''; state.formErrors = {}; loadRepos(); render(); });
        add(root, ab);
      }
    }
    var t = L.totals(groups.active), tiles = el('div', 'totals');
    [['projects', 'projects'], ['waiting', 'waiting on you'], ['openPrs', 'open PRs'], ['openIssues', 'open issues'], ['merged7d', 'merged this week']].forEach(function (p) {
      add(tiles, add(el('div', 'tile'), el('b', '', t[p[0]]), el('span', '', p[1])));
    });
    add(root, tiles);

    add(root, el('h2', '', 'Waiting on you'));
    var w = L.waitingAll(groups.active), wl = el('div', 'list');
    if (!w.length) add(wl, el('div', 'small muted', 'Nothing is waiting on you.'));
    w.forEach(function (x) { add(wl, waitingRow(x)); });
    add(root, wl);

    add(root, el('h2', '', 'Projects'));
    var grid = el('div', 'grid');
    groups.active.forEach(function (c) { add(grid, card(c)); });
    add(root, grid);

    add(root, otherSessions(groups));
    if (groups.archived.length) {
      var d = el('details'); d.open = state.archivedOpen;
      d.addEventListener('toggle', function () { state.archivedOpen = d.open; });
      add(d, el('summary', '', 'Archived projects (' + groups.archived.length + ')'));
      var al = el('div', 'list');
      groups.archived.forEach(function (c) {
        var r = el('div', 'row'), top = el('div', 'top');
        var a = el('a', 'title', c.name); a.href = '#p-' + c.name;
        add(top, a, el('span', 'small muted', c.repo));
        add(r, top);
        if (state.isOwner) add(r, archiveControls(c.name, true));
        add(al, r);
      });
      add(d, al); add(root, d);
    }
    return root;
  }

  // ---- project page ----
  function prRow(pr) {
    var r = el('div', 'row'), top = el('div', 'top');
    add(top, el('span', 'title', '#' + pr.number + ' ' + (pr.title || '')));
    if (pr.draft) add(top, pill('Draft', 'muted'));
    (pr.labels || []).forEach(function (l) { add(top, pill(l, 'muted')); });
    add(r, top);
    var size = L.sizeLabel(pr);
    add(r, el('div', 'small muted', [pr.why || 'Open', L.ageLabel(pr.age_days), size].filter(Boolean).join(' · ')));
    var b = L.truncate(pr.body, 4000);
    if (b.text) add(r, el('pre', 'body', b.text + (b.truncated || pr.body_truncated ? '\n… Read on GitHub' : '')));
    var btns = el('div', 'btns');
    add(btns, link(pr.url, 'Read on GitHub', 'btn'));
    if (state.isOwner) add(btns, link(pr.url, 'Merge on GitHub', 'btn primary'));
    var cf = L.conflictsLabel(pr.mergeable_state);
    if (cf) add(btns, el('span', 'small bad', cf));
    add(r, btns);
    return r;
  }

  function projectPage(c) {
    var root = el('div'), s = c.snap;
    var back = el('a', 'back', '← All projects'); back.href = '#';
    add(root, back, el('h1', '', c.name));
    if (c.project && c.project.archived) add(root, el('div', 'small muted', 'Archived'));
    if (c.repo) add(root, add(el('div', 'small muted'), link('https://github.com/' + c.repo, c.repo)));
    if (c.blurb) add(root, el('div', 'small muted', c.blurb));
    if (state.notice) add(root, el('div', 'small', state.notice));
    if (!s) {
      add(root, message('Waiting for first refresh'));
      add(root, sessionsPanel(c));
      if (state.isOwner && c.project && !c.project.archived) add(root, archiveControls(c.name, false));
      return root;
    }
    if (c.project && c.project.archived) add(root, el('div', 'small muted', 'Data from ' + (s.updated_at ? when(s.updated_at) : 'the last refresh') + ' — say “update the dashboard” to refresh after unarchiving.'));

    var pills = el('div'); pills.style.marginTop = '8px';
    statusPills(pills, c, s);
    add(root, pills);
    if (c.notConnected) add(root, el('div', 'small bad', L.notConnectedText(c.repo, s.not_connected_reason)));
    if (c.project && !c.project.archived && c.stale && s.updated_at) add(root, el('div', 'small muted', 'Data from ' + when(s.updated_at) + ' — say “update the dashboard” to refresh.'));
    var kv = el('dl', 'kv');
    [['Last activity', s.last_activity_at ? when(s.last_activity_at) : ''], ['Stage', s.stage], ['Next step', s.next_step], ['Blockers', s.blockers]].forEach(function (p) {
      if (p[1]) add(kv, el('dt', '', p[0]), el('dd', '', p[1]));
    });
    add(root, kv);

    var prs = Array.isArray(s.open_prs) ? s.open_prs : [];
    add(root, el('h2', '', 'Open PRs (' + (s.open_pr_count == null ? prs.length : s.open_pr_count) + ')'));
    var lab = L.showingLabel(prs.length, s.open_pr_count);
    if (lab) add(root, el('div', 'small muted', lab));
    var pl = el('div', 'list');
    if (!prs.length) add(pl, el('div', 'small muted', 'No open PRs.'));
    L.sortPrs(prs).forEach(function (p) { add(pl, prRow(p)); });
    add(root, pl);

    var issues = Array.isArray(s.open_issues) ? s.open_issues : [];
    add(root, el('h2', '', 'Open issues (' + (s.open_issue_count == null ? issues.length : s.open_issue_count) + ')'));
    lab = L.showingLabel(issues.length, s.open_issue_count);
    if (lab) add(root, el('div', 'small muted', lab));
    var il = el('div', 'list');
    if (!issues.length) add(il, el('div', 'small muted', 'No open issues.'));
    issues.forEach(function (i) {
      var r = el('div', 'row'), top = el('div', 'top');
      add(top, link(i.url, '#' + i.number + ' ' + (i.title || ''), 'title'));
      (i.labels || []).forEach(function (l) { add(top, pill(l, 'muted')); });
      add(r, top, el('div', 'small muted', L.ageLabel(i.age_days)));
      add(il, r);
    });
    add(root, il);

    add(root, el('h2', '', 'This week'));
    var acts = Array.isArray(s.activity) ? s.activity : [];
    var al = el('div', 'list');
    if (!acts.length) add(al, el('div', 'small muted', 'No activity this week.'));
    acts.forEach(function (a) {
      var r = el('div', 'row'), top = el('div', 'top');
      add(top, pill(a.kind || '', 'muted'), link(a.url, a.title || '', 'title'));
      add(r, top, el('div', 'small muted', when(a.at)));
      add(al, r);
    });
    add(root, al);

    add(root, sessionsPanel(c));
    add(root, el('div', 'small muted', s.updated_at ? 'Data as of ' + when(s.updated_at) : ''));
    if (state.isOwner && c.project) add(root, archiveControls(c.name, !!c.project.archived));
    return root;
  }

  // ---- routing / render ----
  function render() {
    var out;
    if (state.db === null) out = message('The shared database is not available. Sign in to claude.ai and reopen this page.');
    else if (state.error) out = message(state.error);
    else if (state.db === undefined || state.projects === null || state.snaps === null) out = message('Loading…');
    else if (!state.projects.length) out = message('No projects yet. The owner can seed or add projects, then say "update the dashboard".');
    else {
      var groups = L.groupProjects(state.projects, state.snaps, state.meta);
      var name = L.parseHash(location.hash);
      if (name) {
        var all = groups.active.concat(groups.archived), found = null;
        all.forEach(function (c) { if (c.name === name) found = c; });
        if (found) out = projectPage(found);
        else {
          out = el('div');
          var b = el('a', 'back', '← All projects'); b.href = '#';
          add(out, b, message('No project called ' + name + '.'));
        }
      } else out = overview(groups);
    }
    var y = window.scrollY;
    app.textContent = '';
    app.appendChild(out);
    window.scrollTo(0, y);
  }

  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });
  render();

  // Subscribe once, after first paint; db may be null (signed out) and can take up to 10 s to settle.
  function start() {
    var c = window.claude;
    if (!c || typeof c.use !== 'function') { state.db = null; render(); return; }
    c.use('user').then(function (u) {
      if (!u) return false;
      return u.isOwner().then(function (o) {
        if (!o) return false;
        return Promise.resolve(typeof u.id === 'function' ? u.id() : null).then(function (id) { if (id) state.userId = String(id); return true; }, function () { return true; });
      });
    }).then(function (o) { state.isOwner = !!o; render(); }, function () {});
    c.use('mcp').then(function (m) {
      state.mcp = m || null;
      if (m) loadSessions(); else render();
    }, function () { state.mcp = null; render(); });
    c.use('db').then(function (db) {
      state.db = db || null;
      if (!db) { render(); return; }
      var fail = function () { state.error = 'Could not read the shared database. Reload the page to retry.'; render(); };
      db.collection('projects').onSnapshot(function (snap) {
        state.projects = L.projectRows(snap.docs);
        render();
      }, fail);
      db.collection('snapshot').onSnapshot(function (snap) {
        var st = L.snapshotState(snap.docs);
        state.snaps = st.snaps; state.meta = st.meta;
        render();
      }, fail);
    }, function () { state.db = null; render(); });
  }
  start();
})();
</script>
